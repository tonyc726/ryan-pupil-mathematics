# This is a basic workflow to help you get started with Actions

name: Deploy on push events

# Controls when the action will run. Triggers the workflow on push events
# but only for the master branch
on:
  push:
    branches: [master]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines.node is >=22.12.0. 20.x is EOL. 24.x is current LTS.
        node-version: [22.x, 24.x]

    # Steps represent a sequence of tasks that can be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Packages
        run: npm ci
      - name: Build page
        env:
          NODE_ENV: production
          VITE_BASE_NAME: '/ryan-pupil-mathematics'
        run: npm run build
      # Publish once. Both matrix legs build; only 22.x pushes build/ to gh-pages.
      - name: Deploy to gh-pages
        if: matrix.node-version == '22.x'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_DEPLOY_ACCESS_TOKEN }}
          branch: gh-pages
          folder: build
